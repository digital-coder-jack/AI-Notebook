<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Chat · AI Notebook</title>
  <meta name="description" content="Chat with your AI study partner: ask questions, learn new topics and create notes." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Notebook" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/logo-192.png" />
  <link rel="apple-touch-icon" href="/assets/logo-192.png" />

  <!-- Apply saved theme before first paint (prevents flash) -->
  <script>
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('ss_theme') || 'dark');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <style>
    .skip-link{position:absolute;left:12px;top:-60px;z-index:10000;padding:10px 16px;border-radius:10px;background:#4F46E5;color:#fff;font-weight:600;text-decoration:none;transition:top .15s}
    .skip-link:focus{top:max(12px,env(safe-area-inset-top))}
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" />
  <link rel="stylesheet" href="/css/premium-design-system.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/chat.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/command-palette.css" />
  <link rel="stylesheet" href="/css/rescue.css" />
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <a class="skip-link" href="#input">Skip to message box</a>
  <noscript><p style="padding:16px;text-align:center">AI Notebook needs JavaScript to run. Please enable it and reload.</p></noscript>

  <div id="toast-wrap" role="status" aria-live="polite"></div>
  <div class="chat-overlay" id="chatOverlay" aria-hidden="true"></div>

  <div class="chat-layout">
    <!-- Conversation sidebar -->
    <aside class="chat-side" id="chatSide" aria-label="Conversations">
      <div class="chat-side-head">
        <a class="brand" href="/dashboard" aria-label="AI Notebook dashboard"><span class="logo"><img src="/assets/logo.png" alt="" width="32" height="32" /></span><span>AI <span class="grad-text">Notebook</span></span></a>
        <button type="button" class="btn block" id="newChatBtn"><i class="fas fa-plus" aria-hidden="true"></i> New chat</button>
      </div>
      <div class="chat-list" id="chatList" role="list" aria-label="Chat history"></div>
      <nav class="chat-side-foot" aria-label="Quick links">
        <a href="/dashboard"><i class="fas fa-gauge-high" aria-hidden="true"></i> Dashboard</a>
        <a href="/tools"><i class="fas fa-toolbox" aria-hidden="true"></i> Tools</a>
      </nav>
    </aside>

    <!-- Chat main -->
    <main class="chat-main" id="main-content">
      <div class="chat-top">
        <div class="title">
          <button type="button" class="icon-btn chat-burger" id="chatBurger" aria-label="Open conversations" aria-controls="chatSide" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
          <span class="chat-brand-mark" aria-hidden="true"><i class="fas fa-sparkles"></i></span>
          <div>
            <span class="eyebrow">PERSONAL AI WORKSPACE</span>
            <h1 id="chatTitle" style="font:inherit;margin:0">AI Notebook</h1>
          </div>
        </div>
        <div class="actions">
          <div class="model-selector" id="modelSelector" title="Choose AI tier">
            <span class="model-dot" id="modelDot" aria-hidden="true"></span>
            <select id="modelSelect" aria-label="AI tier">
              <option value="default">AI Notebook</option>
              <option value="pro">AI Notebook Pro</option>
              <option value="pro_max">AI Notebook Pro Max</option>
            </select>
          </div>
          <button type="button" class="icon-btn" id="downloadBtn" title="Download chat" aria-label="Download chat"><i class="fas fa-download" aria-hidden="true"></i></button>
          <button type="button" class="icon-btn" id="deleteBtn" title="Delete chat" aria-label="Delete chat"><i class="fas fa-trash" aria-hidden="true"></i></button>
        </div>
      </div>

      <!-- role=log announces new messages to screen readers -->
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
        <!-- empty state or messages render here -->
      </div>

      <div class="composer">
        <div class="composer-tools"><span><i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i> Ask, learn, create</span><span class="composer-status" role="status"><i class="fas fa-circle" aria-hidden="true"></i> Ready</span></div>
        <div class="composer-inner">
          <textarea id="input" rows="1" aria-label="Message AI Notebook" aria-describedby="composerHint" placeholder="Ask anything… (Shift+Enter for a new line)" enterkeyhint="send" autocomplete="off"></textarea>
          <button type="button" class="send-btn" id="sendBtn" title="Send" aria-label="Send message"><i class="fas fa-paper-plane" aria-hidden="true"></i></button>
        </div>
        <p class="hint" id="composerHint">AI Notebook can make mistakes. Verify important information. <span>Enter to send · Shift + Enter for a new line</span></p>
      </div>
    </main>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script defer src="/js/config.js"></script>
  <script defer src="/js/analytics-tracker.js"></script>
  <script defer src="/js/app.js"></script>
  <script defer src="/js/motion.js"></script>
  <script defer src="/js/command-palette.js"></script>
  <script defer src="/js/pwa.js"></script>
  <script defer src="/js/chat.js"></script>

  <!-- Vercel Speed Insights -->
  <script type="module">
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@2.0.0/dist/index.mjs';
    injectSpeedInsights();
  </script>
</body>
</html>
