<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notely — Student workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/notely-base.css" />
<link rel="stylesheet" href="css/notely-workspace.css" />
<link rel="stylesheet" href="css/notely-screens-a.css" />
<link rel="stylesheet" href="css/notely-screens-b.css" />
<link rel="stylesheet" href="css/notely-screens-c.css" />
<link rel="stylesheet" href="css/notely-screens-d.css" />
<link rel="stylesheet" href="css/notely-extra.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/notely-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand-mark" id="brandMark"></div>
      <span>Notely</span>
      <button class="mobile-close" id="mobileClose" aria-label="Close menu"></button>
    </div>
    <button class="search-button" data-nav="Search" id="searchBtn"><span class="search-ico"></span><span>Search anything</span><kbd>⌘ K</kbd></button>
    <nav class="primary-nav" aria-label="Main navigation" id="primaryNav"></nav>
    <div class="sidebar-section">
      <p class="eyebrow">My notebooks</p>
      <div id="notebookLinks"></div>
    </div>
    <div class="calendar-snippet">
      <strong>On your calendar</strong>
      <span>Biology study group</span><span>Oct 16 · 3:00 PM</span><span>Library, room 2B</span>
    </div>
    <button class="profile-link" data-nav="Settings"><strong>Jamie Lee</strong><span>Student workspace · Settings</span></button>
  </aside>
  <button class="sidebar-scrim" id="sidebarScrim" aria-label="Close navigation" style="display:none"></button>
  <main class="main-area">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Open menu"></button>
      <span>Student workspace <span class="slash">/</span> <span id="crumbView">Overview</span></span>
      <div class="topbar-user">Fall semester 2026 <span>·</span> Jamie Lee</div>
    </header>
    <div class="page-content" id="viewRoot"></div>
  </main>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="js/notely-icons.js"></script>
<script src="js/notely-data.js"></script>
<script src="js/notely-views-a.js"></script>
<script src="js/notely-views-b.js"></script>
<script src="js/notely-views-c.js"></script>
<script src="js/notely-views-d.js"></script>
<script src="js/notely-views-e.js"></script>
<script src="js/notely-app.js"></script>
</body>
</html>
